html,body{margin:0;height:100%;background:#eceef3;color:#2a2440;font-family:"Silkscreen",ui-monospace,Menlo,monospace}
.wrap{min-height:100%;box-sizing:border-box;padding:16px 0;display:flex;align-items:center;justify-content:center;transition:opacity .7s}
.card{width:320px;padding:0 0 16px;background:#fbf8f0;border:2px solid #2a2440;box-shadow:5px 5px 0 #2a2440;text-align:center}
#sc{display:block;width:320px;height:144px;margin:0 0 14px;border-bottom:2px solid #2a2440;image-rendering:pixelated;image-rendering:crisp-edges}
form>h1,form>p,form>input,form>button,form>#m{margin-left:18px;margin-right:18px;width:calc(100% - 36px)}
h1{margin:0 0 4px;font-size:16px;font-weight:normal;letter-spacing:.12em}
p{margin:0 0 14px;font-size:11px;color:#7a7488;letter-spacing:.04em}
input{width:100%;box-sizing:border-box;padding:9px 12px;border:2px solid #2a2440;border-radius:0;box-shadow:3px 3px 0 #2a2440;font:16px "Silkscreen",monospace;text-align:center;letter-spacing:.35em;background:#fff;outline:none;color:#2a2440}
input:focus{background:#fffdf6}
button{margin-top:12px;width:100%;padding:9px;border:2px solid #2a2440;border-radius:0;background:#4a2585;color:#fff;font:14px "Silkscreen",monospace;letter-spacing:.14em;cursor:pointer;box-shadow:3px 3px 0 #2a2440}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2a2440}
form>.rm{margin-left:18px;margin-right:18px;width:calc(100% - 36px)}
.rm{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:9px;color:#7a7488;letter-spacing:.06em;cursor:pointer}.rm input{width:12px;height:12px;margin:0;box-shadow:none;accent-color:#4a2585}
#m{height:14px;margin-top:10px;font-size:10px;color:#7a7488;letter-spacing:.04em}
.shake{animation:sh .38s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
